[project]
name = "insyta-api"
version = "0.1.0"
description = "Insyta API: ingesta + evaluacion + Optimization Loop para agentes LLM en produccion"
authors = [{ name = "Jose Crespo", email = "josecrespo00001@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "anthropic>=0.39.0",
    "openai>=1.55.0",
    "supabase>=2.10.0",  # DEAD-CODE? 2026-06-24: 0 imports del cliente py (auth usa httpx+jose). Confirmar si se planea usar.
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "spacy>=3.8.0",
    "structlog>=24.4.0",
    "sse-starlette>=2.1.0",  # DEAD-CODE 2026-06-24: SSE no implementado (0 refs). Candidato a remover (ver ADR 0004 diferido).
    "slowapi>=0.1.9",  # DEAD-CODE 2026-06-24: rate limiting nunca integrado (0 refs en código). Candidato a remover.
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "locust>=2.32.0",  # DEAD-CODE 2026-06-24: load-testing, 0 refs, nunca corrido en CI. Candidato a remover.
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
