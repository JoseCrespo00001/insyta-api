# docker-compose de producción para EC2 (sa-east-1).
# Postgres NO está acá: la DB es Supabase (DATABASE_URL en .env).
# Servicios: redis (broker Celery) + migrate (one-shot) + web (uvicorn) + worker (celery).
# web y worker comparten la MISMA imagen (build una vez, reuso).

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Corre las migraciones una vez y termina. web espera a que termine OK.
  migrate:
    build: .
    image: insyta-api:latest
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  web:
    build: .
    image: insyta-api:latest
    restart: unless-stopped
    env_file: .env
    # El broker/cache apunta al redis de este compose (pisa lo que venga del .env).
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    image: insyta-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: ["celery", "-A", "app.services.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2", "-Q", "default"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  redis_data:
